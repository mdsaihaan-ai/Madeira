name: Ultimate Unsigned Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive # Automatically downloads Wine/FEX submodules cleanly

      - name: Compile Unsigned Workspace
        run: |
          xcodebuild clean build -workspace Madeira.xcworkspace \
                                 -scheme Madeira \
                                 -configuration Release \
                                 -sdk iphoneos \
                                 CODE_SIGNING_ALLOWED=NO \
                                 CODE_SIGNING_REQUIRED=NO \
                                 CODE_SIGN_IDENTITY=""

      - name: Package Manual IPA
        run: |
          mkdir -p dist/Payload
          cp -R build/Release-iphoneos/Madeira.app dist/Payload/
          cd dist
          zip -r Madeira.ipa Payload/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Madeira-Unsigned
          path: dist/Madeira.ipa

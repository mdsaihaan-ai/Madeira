name: Build Madeira (Unsigned IPA)

on:
  workflow_dispatch: # Allows you to manually trigger the build with a button click

jobs:
  build:
    name: Compile App Binary
    runs-on: macos-14 # Uses Apple's remote M-series cloud servers

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4
        with:
          submodules: recursive # Automatically downloads the hidden Wine and FEX-Emu sub-folders

      - name: Set up Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Configure CMake Build Target
        run: |
          mkdir build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release -DCMAKE_SYSTEM_NAME=iOS

      - name: Compile and Archive App Binary (No Code-Sign Mode)
        run: |
          cd build
          xcodebuild archive \
            -workspace *.xcworkspace 2>/dev/null || xcodebuild archive -project *.xcodeproj \
            -scheme "Madeira" \
            -destination "generic/platform=iOS" \
            -archivePath ./Madeira.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package Binary into Sideloadable IPA Structure
        run: |
          cd build
          mkdir -p Payload
          cp -r ./Madeira.xcarchive/Products/Applications/*.app ./Payload/
          zip -r Madeira.ipa Payload

      - name: Upload Finished IPA Package to GitHub
        uses: actions/artifacts@v4
        with:
          name: Madeira-Unsigned-IPA
          path: build/Madeira.ipa
          if-no-files-found: error

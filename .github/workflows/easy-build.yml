name: Total Automated Compilation

on:
  workflow_dispatch:

jobs:
  compile-ipa:
    runs-on: macos-14
    steps:
      - name: Checkout Code Natively
        uses: actions/checkout@v4
        with:
          submodules: recursive # Forces Git to cleanly assemble Wine/FEX submodules

      - name: Force Download Missing iOS SDK Components
        run: |
          # Bypasses Error 168 by manually injecting Apple's required mobile layout files
          xcodebuild -downloadPlatform iOS

      - name: Execute Creator Command Sequence
        run: |
          mkdir -p workspace-root
          cd workspace-root
          git clone --recurse-submodules https://github.com
          cd Madeira
          chmod +x ./scripts/build-ipa.sh
          ./scripts/build-ipa.sh
        env:
          CODE_SIGNING_ALLOWED: NO
          CODE_SIGNING_REQUIRED: NO
          CODE_SIGN_IDENTITY: ""

      - name: Find and Package Artifact
        run: |
          mkdir -p output
          find . -name "Madeira.ipa" -exec cp {} output/ \;

      - name: Publish Finished IPA Bundle
        uses: actions/upload-artifact@v4
        with:
          name: Madeira-Package
          path: output/*.ipa

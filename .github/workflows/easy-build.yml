name: Manual Unsigned Madeira Build

on:
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive # Downloads the custom Wine and FEX forks safely

      - name: Force Update Git Submodules
        run: |
          git submodule sync
          git submodule update --init --recursive --force

      - name: Clean Project Build Cache
        run: |
          xcodebuild clean -project app/Madeira.xcodeproj -scheme Madeira || true

      - name: Compile App Binary
        run: |
          xcodebuild build -project app/Madeira.xcodeproj \
                           -scheme Madeira \
                           -sdk iphoneos \
                           -configuration Release \
                           CODE_SIGNING_ALLOWED=NO \
                           CODE_SIGNING_REQUIRED=NO \
                           CODE_SIGN_IDENTITY=""

      - name: Package App Bundle into IPA
        run: |
          mkdir -p dist/Payload
          cp -R build/Release-iphoneos/Madeira.app dist/Payload/
          cd dist
          zip -r Madeira.ipa Payload/

      - name: Upload Finished IPA
        uses: actions/upload-artifact@v4
        with:
          name: Madeira-App
          path: dist/Madeira.ipa
